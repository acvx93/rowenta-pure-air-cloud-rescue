; Purifier firmware: the ESP32-S3 replaces the WiFi module of the Rowenta PU4080 purifier.
;
; Your own OTA password lives in include/ota_password.ini and include/ota_password.h (not in
; git). Copy the *.example.* files to create them; without them the firmware builds with OTA
; updates disabled.
[platformio]
extra_configs = include/ota_password.ini

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
    sinricpro/SinricPro@^3.4.0

; Upload over USB (first install)
[env:usb]

; Upload over WiFi once installed (password in include/ota_password.ini)
[env:ota]
upload_protocol = espota
upload_port = purifier.local
